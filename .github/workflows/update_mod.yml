name: Update mod.js
on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут — токен в клиенте живёт ~1 час
  workflow_dispatch:         # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and push mod.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x update_mod.sh
          ./update_mod.sh
      - name: Purge jsDelivr cache for mod.js
        if: always()
        run: curl -sf "https://purge.jsdelivr.net/gh/petrususanu333/best-te-m@main/mod.js" || true
